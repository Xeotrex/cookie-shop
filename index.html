<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cookie Pre-Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#000000; --flour:#f2f1ee; --crumb:#e4e1da; --muted:#5f5a52;
  --baked:#c07a2c; --baked-ink:#85501a; --danger:#b3261e;
  --serif:"Young Serif",Georgia,serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans)}
.wrap{max-width:600px;margin:0 auto;padding:28px 20px 120px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.15}
h1{font-size:clamp(2rem,8vw,2.6rem);letter-spacing:-.01em}
h2{font-size:1.5rem;margin-bottom:12px}
h3{font-size:1.15rem}
p{margin:0}
a{color:inherit}
.hidden{display:none!important}

/* Header */
h1{text-wrap:balance}
.sub-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:10px 0 26px}
.lede{color:var(--muted);max-width:42ch}
.live{display:inline-flex;align-items:center;gap:7px;flex-shrink:0;padding:6px 12px;border-radius:999px;background:var(--flour);font-size:13px;font-weight:600;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:#1b7f3a}
.live.off i{background:var(--danger)}
@media (prefers-reduced-motion:no-preference){.live:not(.off) i{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.3}}

/* Menu */
.menu{border-top:1px solid var(--crumb)}
.item{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--crumb)}
.pic{width:96px;height:96px;border-radius:18px;overflow:hidden;background:var(--flour);display:grid;place-items:center}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.ph{font-size:34px}
.item.out .pic{filter:grayscale(1);opacity:.5}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.price{font-weight:600;white-space:nowrap}
.desc{color:var(--muted);font-size:14.5px;margin-top:4px}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:12px}
.stock{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--baked-ink)}
.item.out .stock{color:var(--danger)}
.dots{display:flex;flex-wrap:wrap;gap:4px;max-width:184px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--baked)}
.dots i.c{background:var(--ink)}
.dots i.t{background:transparent;box-shadow:inset 0 0 0 1.5px var(--crumb)}
.stepper{display:inline-flex;align-items:center;background:var(--flour);border-radius:999px;padding:4px;flex-shrink:0}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);font:600 19px/1 var(--sans);cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper span{min-width:32px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

/* Sections, lists, fields */
section.block{margin-top:44px}
.sub{color:var(--muted);font-size:14px}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--crumb)}
.lines small{display:block;color:var(--muted);font-size:13px}
.total-row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 2px}
.total-row strong{font-size:1.2rem}
.empty{color:var(--muted);padding:14px 0}
.field{display:block;margin:14px 0}
.field>span,.field>label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
input[type=file]::file-selector-button{margin-right:12px;padding:9px 16px;border:0;border-radius:999px;background:var(--flour);color:var(--ink);font:600 14px var(--sans);cursor:pointer}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--flour);border:1.5px solid transparent;border-radius:12px;padding:11px 14px}
textarea{min-height:84px;resize:vertical}
input::placeholder,textarea::placeholder{color:#77716a}
input[type=file]{background:transparent;padding:6px 0;border:0}
input:focus,textarea:focus{outline:none;border-color:var(--ink);background:var(--paper)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .field{margin:0}
.box{border:1.5px solid var(--crumb);border-radius:22px;padding:20px}
.msg{min-height:1.5em;margin-top:10px;font-size:14.5px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--flour);color:var(--ink);font:600 15px/1 var(--sans);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.small{min-height:36px;padding:0 14px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%;margin-top:6px}
.btn.grow{flex:1}
.btn:disabled{opacity:.4;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* Orders */
.order{padding:18px 0;border-bottom:1px solid var(--crumb)}
.order:first-child{border-top:1px solid var(--crumb)}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.order-top .sub{margin-top:2px}
.items{margin-top:10px}
.note{margin-top:12px;padding:10px 14px;background:var(--flour);border-radius:12px;font-size:14.5px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 8px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
.badge svg{width:14px;height:14px}
.badge.pending{background:#e7f6ec;color:#17692f}
.badge.delayed{background:#fff0dd;color:#a24a00}
.badge.completed{background:#e6eeff;color:#1d47b8}
.badge.cancelled{background:#efefef;color:#555}

/* Owner */
.tabs,.seg{display:flex;gap:4px;background:var(--flour);border-radius:999px;padding:4px}
.tabs{margin:4px 0 26px}
.seg{display:inline-flex;margin-top:14px}
.tabs button,.seg button{flex:1;min-height:40px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:600 15px var(--sans);cursor:pointer}
.seg button{min-height:34px;font-size:14px}
.tabs button.on,.seg button.on{background:var(--ink);color:var(--paper)}
.count{display:inline-block;min-width:20px;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--baked);color:#fff;font-size:12px;line-height:20px}
.sales{margin-bottom:18px;color:var(--muted)}
.sales strong{display:block;font:400 2rem/1.1 var(--serif);color:var(--ink)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 2px;border:0;border-bottom:1px solid var(--crumb);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.hrow:first-child{border-top:1px solid var(--crumb)}
.hrow .sub{display:block}
.hright{display:flex;align-items:center;gap:10px}
.frow{padding:16px 0;border-bottom:1px solid var(--crumb)}
.frow:first-child{border-top:1px solid var(--crumb)}
.frow.is-hidden h3{color:var(--muted)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:#fdecea;color:var(--danger);font-size:12.5px;font-weight:600;white-space:nowrap}
.owner-nav{display:flex;align-items:center;gap:14px;margin:8px 0 24px;color:var(--muted)}

/* Sticky order bar */
.bar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;width:min(560px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 20px;border-radius:999px;background:var(--ink);color:var(--paper);box-shadow:0 10px 30px rgba(0,0,0,.2);font-weight:600}
.bar .btn{background:var(--paper);color:var(--ink)}

/* Receipt */
dialog{border:0;padding:0;background:transparent;width:min(380px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:rise .2s ease-out}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.paper{--zz:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/20px 100%;background:var(--paper);padding:28px 24px 44px;border-radius:8px 8px 0 0;-webkit-mask:var(--zz);mask:var(--zz)}
.r-head{text-align:center;margin-bottom:18px}
.r-head h2{margin:0 0 2px;font-size:1.45rem}
.r-meta{margin:0;display:grid;gap:7px;font-size:14.5px}
.r-meta div{display:flex;justify-content:space-between;align-items:center;gap:12px}
.r-meta dt{color:var(--muted)}
.r-meta dd{margin:0;text-align:right}
.cut{border:0;border-top:1.5px dashed var(--crumb);margin:16px 0}
.r-lines li{border:0;padding:6px 0}
.r-total{display:flex;justify-content:space-between;align-items:baseline;font:400 1.45rem var(--serif)}
.r-note{margin-top:14px;font-size:14.5px}
.r-thanks{margin-top:20px;text-align:center;color:var(--muted);font-size:14px}
.dialog-actions{display:flex;justify-content:center;gap:8px;margin-top:14px}
.dialog-actions .btn{flex:1;max-width:160px}
.dialog-actions .btn{background:var(--paper)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;width:max-content;max-width:min(360px,calc(100% - 32px));padding:12px 18px;border-radius:16px;text-align:center;background:var(--ink);color:var(--paper);font-size:14.5px;font-weight:500}

@media (max-width:420px){
  .item{grid-template-columns:80px 1fr;gap:14px}
  .pic{width:80px;height:80px;border-radius:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="shop-name">Cookie Pre-Order</h1>
    <div class="sub-head">
      <p class="lede" id="lede">Pick your cookies and reserve them before the next batch is baked.</p>
      <p class="live off" id="live"><i></i><span id="live-text">Connecting…</span></p>
    </div>
  </header>

  <!-- Customer view -->
  <main id="shop">
    <section id="menu" class="menu" aria-label="Flavors"></section>

    <section id="checkout" class="block">
      <h2>Your order</h2>
      <div id="cart"></div>
      <label class="field"><span>Your name</span><input id="name" autocomplete="name" placeholder="So the baker knows whose cookies these are"></label>
      <button id="place" class="btn primary wide">Place order</button>
      <p id="msg" class="msg" role="status"></p>
    </section>

    <section id="mine" class="block hidden">
      <h2>My orders</h2>
      <p class="sub">Orders placed from this phone.</p>
      <div id="mine-list" style="margin-top:12px"></div>
    </section>
  </main>

  <!-- Owner view (open the page with #admin at the end of the link) -->
  <main id="admin" class="hidden">
    <div id="login" class="box">
      <h2>Owner sign in</h2>
      <label class="field"><span>Password</span><input id="token" type="password" autocomplete="current-password"></label>
      <button id="unlock" class="btn primary">Unlock</button>
      <p id="login-msg" class="msg" role="status"></p>
    </div>

    <div id="tools" class="hidden">
      <nav class="tabs" aria-label="Owner sections">
        <button data-act="tab" data-id="orders" class="on">Orders<span class="count hidden" id="count-orders"></span></button>
        <button data-act="tab" data-id="history">History</button>
        <button data-act="tab" data-id="flavors">Flavors</button>
      </nav>

      <section id="tab-orders"><div id="orders"></div></section>

      <section id="tab-history" class="hidden">
        <div id="sales" class="sales"></div>
        <div id="history"></div>
      </section>

      <section id="tab-flavors" class="hidden">
        <form id="flavor-form" class="box" autocomplete="off">
          <h2 id="form-title">Add a flavor</h2>
          <label class="field"><span>Flavor</span><input id="f-flavor" placeholder="S'mores"></label>
          <div class="two">
            <label class="field"><span>Price (₱)</span><input id="f-price" type="number" inputmode="decimal" min="0" step="any"></label>
            <label class="field"><span>Cookies on hand</span><input id="f-stock" type="number" inputmode="numeric" min="0"></label>
          </div>
          <label class="field"><span>Batch</span><input id="f-batch" placeholder="Nov 14 pickup"></label>
          <label class="field"><span>Description</span><textarea id="f-desc" placeholder="Toasted marshmallow, graham and chocolate"></textarea></label>
          <label class="field"><span>Photo</span><input id="f-photo" type="file" accept="image/*"></label>
          <p class="sub">Completed orders come out of cookies on hand automatically.</p>
          <div class="actions">
            <button class="btn primary" id="save" type="submit">Save flavor</button>
            <button class="btn hidden" id="cancel-edit" type="button" data-act="cancel-flavor-edit">Cancel</button>
          </div>
          <p class="msg" id="save-msg" role="status"></p>
        </form>
        <div id="flavors" style="margin-top:24px"></div>
      </section>
    </div>
  </main>
</div>

<div id="bar" class="bar hidden" role="region" aria-label="Order summary">
  <span id="bar-text"></span>
  <button class="btn" data-act="go-checkout">Review order</button>
</div>

<dialog id="receipt" aria-label="Receipt">
  <div class="paper" id="receipt-body"></div>
  <div class="dialog-actions" id="receipt-actions"></div>
</dialog>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
// Paste your Apps Script Web app URL here.
const API = "https://script.google.com/macros/s/AKfycbxmkdMrL_Q-cNEfZOn0TA_1rfbH3F6JTn1BviG2IsSXwWwHpXZWu3E4wDXxGZJKaUWAng/exec";
// Your shop name, shown at the top and on receipts.
const SHOP_NAME = "Cookie Pre-Order";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const peso = n => "₱" + (Number(n) || 0).toLocaleString("en-PH");
const shortId = id => "#" + String(id).replace(/-/g, "").slice(0, 6).toUpperCase();
const parseItems = s => { try { return JSON.parse(s || "[]") || []; } catch (_) { return []; } };
const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
function when(d, long) {
  if (!d) return "";
  const t = new Date(d);
  if (isNaN(t)) return "";
  return t.toLocaleString("en-PH", long
    ? { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" }
    : { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}
// Only touch the page when something actually changed, so nothing flickers.
function paint(el, html) { if (el._html !== html) { el._html = html; el.innerHTML = html; } }

document.title = SHOP_NAME;
$("shop-name").textContent = SHOP_NAME;

const ICONS = {
  pending: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.2"/><path d="M8 4.8V8l2.2 1.4"/></svg>',
  delayed: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2 14.4 13.4H1.6Z"/><path d="M8 6.6v3"/><path d="M8 11.7v.1"/></svg>',
  completed: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.2"/><path d="m5.3 8.2 1.9 1.9 3.6-3.8"/></svg>',
  cancelled: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="6.2"/><path d="m5.9 5.9 4.2 4.2m0-4.2-4.2 4.2"/></svg>'
};
const LABELS = { pending: "Pending", delayed: "Delayed", completed: "Completed", cancelled: "Cancelled" };
function badge(st) {
  st = LABELS[st] ? st : "pending";
  return `<span class="badge ${st}">${ICONS[st]}${LABELS[st]}</span>`;
}

async function api(body) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ ...body, token }) });
  return r.json();
}

let toastTimer;
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add("hidden"), 2600);
}

function setLive(ok) {
  $("live").classList.toggle("off", !ok);
  $("live-text").textContent = ok ? (isOwnerView() ? "Live" : "Live stock") : "Reconnecting…";
}

/* ---------------- Customer ---------------- */
let flavors = [], photos = {}, photosAt = 0, cart = {}, mine = [];
let editing = null, editQty = {}, cancelArmed = null, mineMsg = {}, openAfterPlace = null;
let shopSeq = 0, shopApplied = 0;
const MY_KEY = "myOrderIds";

const flavorById = id => flavors.find(f => f.id === id);
const left = f => Math.max(0, (Number(f.stock) || 0) - (Number(f.sold) || 0));
function myIds() { try { return JSON.parse(localStorage.getItem(MY_KEY) || "[]"); } catch (_) { return []; } }
function setMyIds(ids) { try { localStorage.setItem(MY_KEY, JSON.stringify(ids)); } catch (_) {} }

async function loadShop() {
  const my = ++shopSeq;
  const ids = myIds();
  // Photos are big, so they're fetched now and then instead of every second.
  const wantPhotos = Date.now() - photosAt > 30000;
  const q = [];
  if (wantPhotos) q.push("photos=1");
  if (ids.length) q.push("mine=" + encodeURIComponent(ids.join(",")));
  const d = await (await fetch(API + (q.length ? "?" + q.join("&") : ""))).json();
  if (my < shopApplied) return;
  shopApplied = my;

  flavors = d.flavors || [];
  flavors.forEach(f => { if (f.photo !== undefined) photos[f.id] = f.photo; });
  if (wantPhotos) photosAt = Date.now();
  if (flavors.some(f => !(f.id in photos))) photosAt = 0; // a new flavor appeared: get its photo next time

  // Keep the cart within what's left.
  Object.keys(cart).forEach(id => {
    const f = flavorById(id);
    if (!f) delete cart[id];
    else cart[id] = Math.min(cart[id], left(f));
  });

  if (d.mine) {
    mine = d.mine;
    const found = new Set(mine.map(o => o.id));
    if (ids.some(id => !found.has(id))) setMyIds(ids.filter(id => found.has(id))); // deleted by the seller
  } else if (ids.length) {
    const m = await api({ action: "myOrders", ids }); // older Apps Script version
    mine = m.orders || [];
  } else {
    mine = [];
  }

  setLive(true);
  renderMenu();
  renderCart();
  renderMine();
}

function dots(f) {
  const total = Math.max(0, Number(f.stock) || 0);
  if (!total || total > 24) return "";
  const l = left(f), mineQ = Math.min(cart[f.id] || 0, l);
  return '<span class="dots" aria-hidden="true">' +
    '<i class="c"></i>'.repeat(mineQ) + "<i></i>".repeat(l - mineQ) + '<i class="t"></i>'.repeat(Math.max(0, total - l)) +
    "</span>";
}

function itemBody(f) {
  const l = left(f), q = cart[f.id] || 0, out = l <= 0;
  return `<div class="head"><h3>${esc(f.flavor)}</h3><span class="price">${peso(f.price)}</span></div>
    ${f.description ? `<p class="desc">${esc(f.description)}</p>` : ""}
    <div class="foot">
      <div class="stock">${dots(f)}<span>${out ? "Sold out" : l + " left"}</span></div>
      <div class="stepper">
        <button data-act="rm" data-id="${esc(f.id)}" ${q <= 0 ? "disabled" : ""} aria-label="One less ${esc(f.flavor)}">−</button>
        <span aria-live="polite">${q}</span>
        <button data-act="add" data-id="${esc(f.id)}" ${q >= l ? "disabled" : ""} aria-label="One more ${esc(f.flavor)}">+</button>
      </div>
    </div>`;
}

function renderMenu() {
  const menu = $("menu");
  if (!flavors.length) { paint(menu, '<p class="empty">No cookies on the menu right now. Check back soon.</p>'); return; }
  menu._html = null;
  const keep = new Set();
  flavors.forEach((f, i) => {
    let el = [...menu.children].find(c => c.dataset.item === f.id);
    if (!el) {
      el = document.createElement("article");
      el.className = "item";
      el.dataset.item = f.id;
      el.innerHTML = '<div class="pic"></div><div class="body"></div>';
    }
    if (menu.children[i] !== el) menu.insertBefore(el, menu.children[i] || null);
    el.classList.toggle("out", left(f) <= 0);
    const pic = el.firstElementChild, src = photos[f.id] || "";
    if (pic._src !== src) {
      pic._src = src;
      pic.innerHTML = src ? `<img src="${esc(src)}" alt="">` : '<span class="ph" aria-hidden="true">🍪</span>';
    }
    paint(el.lastElementChild, itemBody(f));
    keep.add(el);
  });
  [...menu.children].forEach(c => { if (!keep.has(c)) c.remove(); });
}

function cartLines() {
  return flavors.filter(f => cart[f.id] > 0).map(f => ({ f, q: cart[f.id], sum: cart[f.id] * Number(f.price) }));
}

let checkoutInView = false;
function renderCart() {
  const lines = cartLines();
  const total = lines.reduce((s, l) => s + l.sum, 0), count = lines.reduce((s, l) => s + l.q, 0);
  paint($("cart"), lines.length
    ? `<ul class="lines">${lines.map(l => `<li><span>${esc(l.f.flavor)} × ${l.q}</span><span>${peso(l.sum)}</span></li>`).join("")}</ul>
       <p class="total-row"><span>Total</span><strong>${peso(total)}</strong></p>`
    : '<p class="empty">Tap + on a flavor to add it here.</p>');
  $("place").disabled = !lines.length;
  $("bar-text").textContent = plural(count, "cookie", "cookies") + ", " + peso(total);
  $("bar").classList.toggle("hidden", !count || checkoutInView || isOwnerView());
}
new IntersectionObserver(es => { checkoutInView = es[0].isIntersecting; renderCart(); }).observe($("checkout"));

function mineCard(o) {
  const st = o.status || "pending", items = parseItems(o.items), id = esc(o.id);
  return `<article class="order">
    <div class="order-top"><div><h3>Order ${shortId(o.id)}</h3><p class="sub">${when(o.createdAt)}</p></div>${badge(st)}</div>
    <p class="items">${items.map(i => `${esc(i.flavor)} × ${i.qty}`).join(", ")}</p>
    <p class="total-row"><span>Total</span><strong>${peso(o.total)}</strong></p>
    ${o.note ? `<p class="note"><strong>From the baker:</strong> ${esc(o.note)}</p>` : ""}
    <div class="actions">
      <button class="btn small" data-act="receipt-mine" data-id="${id}">Receipt</button>
      ${st === "pending" ? `<button class="btn small" data-act="edit-mine" data-id="${id}">Edit</button>
        <button class="btn small ghost danger" data-act="cancel-mine" data-id="${id}">${cancelArmed === o.id ? "Tap again to cancel" : "Cancel order"}</button>` : ""}
      ${st === "completed" || st === "cancelled" ? `<button class="btn small ghost" data-act="dismiss" data-id="${id}">Dismiss</button>` : ""}
    </div>
    ${mineMsg[o.id] ? `<p class="msg">${esc(mineMsg[o.id])}</p>` : ""}
  </article>`;
}

function editMax(o, f) {
  const orig = (parseItems(o.items).find(i => i.id === f.id) || {}).qty || 0;
  return left(f) + Number(orig);
}

function editCard(o) {
  let total = 0;
  const rows = flavors.map(f => {
    const q = editQty[f.id] || 0;
    total += q * Number(f.price);
    return `<li><span>${esc(f.flavor)}<small>${peso(f.price)} each</small></span>
      <span class="stepper">
        <button data-act="eq-rm" data-id="${esc(f.id)}" ${q <= 0 ? "disabled" : ""} aria-label="One less ${esc(f.flavor)}">−</button>
        <span>${q}</span>
        <button data-act="eq-add" data-id="${esc(f.id)}" ${q >= editMax(o, f) ? "disabled" : ""} aria-label="One more ${esc(f.flavor)}">+</button>
      </span></li>`;
  }).join("");
  return `<article class="order">
    <h3>Edit order ${shortId(o.id)}</h3>
    <ul class="lines" style="margin-top:8px">${rows}</ul>
    <p class="total-row"><span>New total</span><strong>${peso(total)}</strong></p>
    <div class="actions">
      <button class="btn small primary" data-act="save-edit" data-id="${esc(o.id)}">Save changes</button>
      <button class="btn small" data-act="close-edit">Close</button>
    </div>
    ${mineMsg[o.id] ? `<p class="msg">${esc(mineMsg[o.id])}</p>` : ""}
  </article>`;
}

function renderMine() {
  const list = mine.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  $("mine").classList.toggle("hidden", !list.length);
  if (editing && !list.some(o => o.id === editing && (o.status || "pending") === "pending")) editing = null;
  paint($("mine-list"), list.map(o => (editing === o.id ? editCard(o) : mineCard(o))).join(""));
  if (openAfterPlace) {
    const o = mine.find(x => x.id === openAfterPlace);
    if (o) { openAfterPlace = null; showReceipt(o, false, "Order placed"); }
  }
}

$("name").value = localStorage.getItem("myName") || "";

$("place").onclick = async () => {
  const name = $("name").value.trim();
  if (!name) { $("msg").textContent = "Enter your name so the baker knows whose order it is."; $("name").focus(); return; }
  const items = cartLines().map(l => ({ id: l.f.id, qty: l.q }));
  if (!items.length) { $("msg").textContent = "Add at least one cookie."; return; }
  $("place").disabled = true;
  $("msg").textContent = "Placing your order…";
  try {
    const d = await api({ action: "order", name, items });
    if (d.error) { $("msg").textContent = d.error; return; }
    try { localStorage.setItem("myName", name); } catch (_) {}
    setMyIds([...myIds(), d.id]);
    cart = {};
    openAfterPlace = d.id;
    $("msg").textContent = "Order placed. You can track it under My orders.";
    await loadShop();
  } catch (_) {
    $("msg").textContent = "Couldn't place the order. Check your connection and try again.";
  } finally {
    $("place").disabled = !cartLines().length;
  }
};

/* ---------------- Receipt ---------------- */
let receiptOrder = null, receiptOwner = false, receiptDelArmed = false;
function showReceipt(o, owner, heading) {
  receiptOrder = o; receiptOwner = owner; receiptDelArmed = false;
  const st = o.status || "pending", items = parseItems(o.items);
  const cookies = items.reduce((s, i) => s + (Number(i.qty) || 0), 0);
  $("receipt-body").innerHTML = `
    <div class="r-head">
      <p class="sub">${esc(heading || "Receipt")}</p>
      <h2>${esc(SHOP_NAME)}</h2>
      <p class="sub">Order ${shortId(o.id)}</p>
    </div>
    <dl class="r-meta">
      ${o.name ? `<div><dt>Name</dt><dd>${esc(o.name)}</dd></div>` : ""}
      <div><dt>Ordered</dt><dd>${when(o.createdAt, true)}</dd></div>
      ${o.completedAt ? `<div><dt>Completed</dt><dd>${when(o.completedAt, true)}</dd></div>` : ""}
      <div><dt>Status</dt><dd>${badge(st)}</dd></div>
    </dl>
    <hr class="cut">
    <ul class="lines r-lines">${items.map(i => {
      const has = i.price !== undefined && i.price !== "";
      return `<li><span>${esc(i.flavor)}<small>${has ? i.qty + " × " + peso(i.price) : "Qty " + i.qty}</small></span><span>${has ? peso(i.qty * i.price) : ""}</span></li>`;
    }).join("")}</ul>
    <hr class="cut">
    <p class="r-total"><span>Total</span><span>${peso(o.total)}</span></p>
    <p class="sub">${plural(cookies, "cookie", "cookies")}</p>
    ${o.note ? `<p class="r-note"><strong>Note:</strong> ${esc(o.note)}</p>` : ""}
    <p class="r-thanks">Thank you for ordering!</p>`;
  renderReceiptActions();
  if (!$("receipt").open) $("receipt").showModal();
}
function renderReceiptActions() {
  const o = receiptOrder, owner = receiptOwner;
  $("receipt-actions").innerHTML =
    (owner && o.status === "completed" ? '<button class="btn" data-act="r-reopen">Reopen</button>' : "") +
    (owner ? `<button class="btn danger" data-act="r-delete">${receiptDelArmed ? "Tap again to delete" : "Delete"}</button>` : "") +
    '<button class="btn" data-act="r-close" autofocus>Close</button>';
}
$("receipt").addEventListener("click", e => { if (e.target === $("receipt")) $("receipt").close(); });

/* ---------------- Owner ---------------- */
let token = sessionStorage.getItem("token") || "";
let orders = [], ownerFl = [], noteDraft = {}, delArmed = null, delFlavorArmed = null, tab = "orders", editingFlavor = null;
let ownSeq = 0, ownApplied = 0;
const isOwnerView = () => location.hash === "#admin";
const stamp = o => new Date(o.completedAt || o.createdAt).getTime() || 0;

async function loadOwner() {
  const my = ++ownSeq;
  const d = await api({ action: "ownerData" });
  if (my < ownApplied) return;
  ownApplied = my;
  if (d.error) {
    if (d.error === "Wrong password") return lockOwner("Please sign in again.");
    setLive(false);
    $("live-text").textContent = "Update the Apps Script";
    return;
  }
  orders = d.orders || [];
  ownerFl = d.flavors || [];
  setLive(true);
  renderOwner();
}

function ownerOrderCard(o) {
  const st = o.status || "pending", id = esc(o.id);
  if (noteDraft[o.id] === (o.note || "")) delete noteDraft[o.id];
  const note = noteDraft[o.id] ?? o.note ?? "";
  return `<article class="order">
    <div class="order-top"><div><h3>${esc(o.name)}</h3><p class="sub">${when(o.createdAt)}, order ${shortId(o.id)}</p></div>${badge(st)}</div>
    <ul class="lines" style="margin-top:8px">${parseItems(o.items).map(i =>
      `<li><span>${esc(i.flavor)} × ${i.qty}</span><span>${i.price !== undefined ? peso(i.qty * i.price) : ""}</span></li>`).join("")}</ul>
    <p class="total-row"><span>Total</span><strong>${peso(o.total)}</strong></p>
    <div class="seg" role="group" aria-label="Status">
      <button data-act="set-status" data-status="pending" data-id="${id}" class="${st === "pending" ? "on" : ""}" aria-pressed="${st === "pending"}">Pending</button>
      <button data-act="set-status" data-status="delayed" data-id="${id}" class="${st === "delayed" ? "on" : ""}" aria-pressed="${st === "delayed"}">Delayed</button>
    </div>
    <div class="field"><label for="note-${id}">Note for the customer</label>
      <div class="inline"><input id="note-${id}" data-note="${id}" value="${esc(note)}" placeholder="Ready Monday after lunch">
        <button class="btn" data-act="save-note" data-id="${id}">Save</button></div></div>
    <div class="actions">
      <button class="btn primary grow" data-act="complete" data-id="${id}">Mark completed</button>
      <button class="btn ghost danger" data-act="del-order" data-id="${id}">${delArmed === o.id ? "Tap again to delete" : "Delete"}</button>
    </div>
  </article>`;
}

function renderOwner() {
  const active = orders.filter(o => !o.status || o.status === "pending" || o.status === "delayed")
    .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  const done = orders.filter(o => o.status === "completed" || o.status === "cancelled").sort((a, b) => stamp(b) - stamp(a));

  $("count-orders").textContent = active.length;
  $("count-orders").classList.toggle("hidden", !active.length);

  // Don't redraw orders while the owner is typing a note.
  const ae = document.activeElement;
  if (!(ae && ae.tagName === "INPUT" && $("orders").contains(ae))) {
    paint($("orders"), active.map(ownerOrderCard).join("") || '<p class="empty">No open orders. New ones show up here right away.</p>');
  }

  const comp = done.filter(o => o.status === "completed");
  const sales = comp.reduce((s, o) => s + (Number(o.total) || 0), 0);
  const cookies = comp.reduce((s, o) => s + parseItems(o.items).reduce((t, i) => t + (Number(i.qty) || 0), 0), 0);
  paint($("sales"), comp.length ? `<strong>${peso(sales)}</strong>from ${plural(comp.length, "completed order", "completed orders")}, ${plural(cookies, "cookie", "cookies")}` : "");
  paint($("history"), done.map(o => `<button class="hrow" data-act="receipt-owner" data-id="${esc(o.id)}">
      <span><strong>${esc(o.name)}</strong><span class="sub">${when(o.completedAt || o.createdAt)}</span></span>
      <span class="hright"><span>${peso(o.total)}</span>${badge(o.status)}</span>
    </button>`).join("") || '<p class="empty">Completed orders show up here as receipts.</p>');

  paint($("flavors"), ownerFl.map(f => {
    const id = esc(f.id), l = Math.max(0, f.stock - f.reserved);
    return `<div class="frow ${f.hidden ? "is-hidden" : ""}">
      <div class="order-top"><div><h3>${esc(f.flavor)}</h3><p class="sub">${peso(f.price)}${f.batch ? ", " + esc(f.batch) : ""}</p></div>
        ${f.hidden ? '<span class="tag">Hidden from customers</span>' : ""}</div>
      <p class="sub" style="margin-top:6px">${f.stock} on hand, ${f.reserved} reserved by orders, ${l} left to order</p>
      <div class="actions">
        <button class="btn small" data-act="toggle-hide" data-id="${id}">${f.hidden ? "Show to customers" : "Hide"}</button>
        <button class="btn small" data-act="edit-flavor" data-id="${id}">Edit</button>
        <button class="btn small ghost danger" data-act="del-flavor" data-id="${id}">${delFlavorArmed === f.id ? "Tap again to delete" : "Delete"}</button>
      </div>
    </div>`;
  }).join("") || '<p class="empty">No flavors yet. Add your first one above.</p>');
}

function showTab(t) {
  tab = t;
  ["orders", "history", "flavors"].forEach(x => $("tab-" + x).classList.toggle("hidden", x !== t));
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.id === t));
}

function lockOwner(text) {
  token = "";
  sessionStorage.removeItem("token");
  $("tools").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("login-msg").textContent = text || "";
  route();
}

$("unlock").onclick = async () => {
  token = $("token").value;
  $("login-msg").textContent = "Checking…";
  try {
    const d = await api({ action: "ownerData" });
    if (d.error) { token = ""; $("login-msg").textContent = d.error === "Wrong password" ? "That password didn't work." : d.error; return; }
    sessionStorage.setItem("token", token);
    $("token").value = "";
    $("login-msg").textContent = "";
    route();
    orders = d.orders || []; ownerFl = d.flavors || [];
    renderOwner();
  } catch (_) {
    token = "";
    $("login-msg").textContent = "Couldn't reach the shop. Check your connection.";
  }
};
$("token").addEventListener("keydown", e => { if (e.key === "Enter") $("unlock").click(); });

document.addEventListener("input", e => { if (e.target.dataset.note) noteDraft[e.target.dataset.note] = e.target.value; });

function readPhoto(file) {
  return new Promise(resolve => {
    if (!file) return resolve("");
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 300 / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = img.width * s; cv.height = img.height * s;
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL("image/jpeg", 0.7));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function clearFlavorForm() {
  editingFlavor = null;
  ["f-flavor", "f-price", "f-desc", "f-stock", "f-batch"].forEach(id => ($(id).value = ""));
  $("f-photo").value = "";
  $("form-title").textContent = "Add a flavor";
  $("save").textContent = "Save flavor";
  $("cancel-edit").classList.add("hidden");
}

$("flavor-form").onsubmit = async e => {
  e.preventDefault();
  const flavor = $("f-flavor").value.trim(), price = Number($("f-price").value);
  const batch = $("f-batch").value.trim() || "current";
  if (!flavor || !price) { $("save-msg").textContent = "Add a flavor name and a price."; return; }
  $("save").disabled = true;
  $("save-msg").textContent = "Saving…";
  try {
    // Editing keeps the original id so the same row is updated.
    const id = editingFlavor || (slug(flavor) + "-" + slug(batch));
    const photo = await readPhoto($("f-photo").files[0]); // blank keeps the current photo
    const d = await api({ action: "saveFlavor", flavor: { id, flavor, price, description: $("f-desc").value.trim(), batch, stock: Number($("f-stock").value) || 0, photo } });
    $("save-msg").textContent = d.error ? d.error : (editingFlavor ? "Flavor updated." : "Flavor saved.");
    if (!d.error) clearFlavorForm();
    photosAt = 0;
    await loadOwner();
  } catch (_) {
    $("save-msg").textContent = "Couldn't save. Check your connection and try again.";
  } finally {
    $("save").disabled = false;
  }
};

/* ---------------- Buttons ---------------- */
const acts = {
  add(id) { const f = flavorById(id); if (f) { cart[id] = Math.min((cart[id] || 0) + 1, left(f)); renderMenu(); renderCart(); } },
  rm(id) { cart[id] = Math.max((cart[id] || 0) - 1, 0); renderMenu(); renderCart(); },
  "go-checkout"() {
    const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
    $("checkout").scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
  },

  "receipt-mine"(id) { const o = mine.find(x => x.id === id); if (o) showReceipt(o, false); },
  "edit-mine"(id) {
    const o = mine.find(x => x.id === id); if (!o) return;
    editing = id; cancelArmed = null; mineMsg[id] = "";
    editQty = {};
    parseItems(o.items).forEach(i => (editQty[i.id] = Number(i.qty) || 0));
    renderMine();
  },
  "close-edit"() { editing = null; renderMine(); },
  "eq-add"(id) {
    const o = mine.find(x => x.id === editing), f = flavorById(id); if (!o || !f) return;
    editQty[id] = Math.min((editQty[id] || 0) + 1, editMax(o, f)); renderMine();
  },
  "eq-rm"(id) { editQty[id] = Math.max((editQty[id] || 0) - 1, 0); renderMine(); },
  async "save-edit"(id) {
    const items = Object.keys(editQty).filter(k => editQty[k] > 0).map(k => ({ id: k, qty: editQty[k] }));
    if (!items.length) { mineMsg[id] = "Add at least one cookie, or cancel the order instead."; return renderMine(); }
    mineMsg[id] = "Saving…"; renderMine();
    const d = await api({ action: "editOrder", id, items });
    mineMsg[id] = d.error || "";
    if (!d.error) { editing = null; toast("Order updated."); }
    await loadShop();
  },
  async "cancel-mine"(id) {
    if (cancelArmed !== id) { cancelArmed = id; return renderMine(); }
    cancelArmed = null;
    const d = await api({ action: "editOrder", id, cancel: true });
    mineMsg[id] = d.error || "";
    if (!d.error) toast("Order cancelled.");
    await loadShop();
  },
  dismiss(id) { setMyIds(myIds().filter(x => x !== id)); mine = mine.filter(o => o.id !== id); renderMine(); },

  tab(id) { showTab(id); },
  async "set-status"(id, b) {
    const o = orders.find(x => x.id === id); if (!o) return;
    await api({ action: "updateOrder", id, status: b.dataset.status, note: noteDraft[id] ?? o.note ?? "" });
    await loadOwner();
  },
  async "save-note"(id) {
    const o = orders.find(x => x.id === id); if (!o) return;
    const d = await api({ action: "updateOrder", id, status: o.status || "pending", note: noteDraft[id] ?? o.note ?? "" });
    if (!d.error) toast("Note saved.");
    await loadOwner();
  },
  async complete(id) {
    const o = orders.find(x => x.id === id); if (!o) return;
    const d = await api({ action: "updateOrder", id, status: "completed", note: noteDraft[id] ?? o.note ?? "" });
    if (d.error) return toast(d.error);
    delete noteDraft[id];
    toast("Completed. Moved to History.");
    await loadOwner();
  },
  async "del-order"(id) {
    if (delArmed !== id) { delArmed = id; $("orders")._html = null; return renderOwner(); }
    delArmed = null;
    await api({ action: "deleteOrder", id });
    toast("Order deleted.");
    await loadOwner();
  },
  "receipt-owner"(id) { const o = orders.find(x => x.id === id); if (o) showReceipt(o, true); },
  async "r-reopen"() {
    const o = receiptOrder; if (!o) return;
    await api({ action: "updateOrder", id: o.id, status: "pending", note: o.note || "" });
    $("receipt").close();
    toast("Reopened. Its cookies are back in stock.");
    await loadOwner();
  },
  async "r-delete"() {
    if (!receiptDelArmed) { receiptDelArmed = true; return renderReceiptActions(); }
    await api({ action: "deleteOrder", id: receiptOrder.id });
    $("receipt").close();
    toast("Order deleted.");
    await loadOwner();
  },
  "r-close"() { $("receipt").close(); },

  async "toggle-hide"(id) {
    const f = ownerFl.find(x => x.id === id); if (!f) return;
    await api({ action: "setHidden", id, hidden: !f.hidden });
    toast(f.hidden ? f.flavor + " is back on the menu." : f.flavor + " is hidden from customers.");
    await loadOwner();
  },
  "edit-flavor"(id) {
    const f = ownerFl.find(x => x.id === id); if (!f) return;
    editingFlavor = f.id;
    $("f-flavor").value = f.flavor || "";
    $("f-price").value = f.price || "";
    $("f-desc").value = f.description || "";
    $("f-stock").value = f.stock || 0;
    $("f-batch").value = f.batch || "";
    $("f-photo").value = "";
    $("form-title").textContent = "Edit " + f.flavor;
    $("save").textContent = "Update flavor";
    $("cancel-edit").classList.remove("hidden");
    $("save-msg").textContent = f.hasPhoto ? "Leave the photo empty to keep the current one." : "";
    $("flavor-form").scrollIntoView({ block: "start" });
    $("f-flavor").focus({ preventScroll: true });
  },
  "cancel-flavor-edit"() { clearFlavorForm(); $("save-msg").textContent = ""; },
  async "del-flavor"(id) {
    if (delFlavorArmed !== id) { delFlavorArmed = id; return renderOwner(); }
    delFlavorArmed = null;
    await api({ action: "deleteFlavor", id });
    toast("Flavor deleted.");
    await loadOwner();
  }
};

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]");
  if (!b || !acts[b.dataset.act]) return;
  e.preventDefault();
  b.disabled = true;
  try { await acts[b.dataset.act](b.dataset.id, b); }
  catch (_) { toast("Couldn't reach the shop. Try again."); }
  finally { if (b.isConnected) b.disabled = false; }
});

/* ---------------- Start ---------------- */
function route() {
  const owner = isOwnerView();
  $("shop").classList.toggle("hidden", owner);
  $("admin").classList.toggle("hidden", !owner);
  $("lede").innerHTML = !owner
    ? "Pick your cookies and reserve them before the next batch is baked."
    : token
      ? 'Owner view. <a href="#">Open the shop</a> or <a href="#admin" data-act="sign-out">sign out</a>.'
      : 'Owner view. <a href="#">Open the shop</a>';
  $("live").classList.toggle("hidden", owner && !token);
  if (owner) {
    $("login").classList.toggle("hidden", !!token);
    $("tools").classList.toggle("hidden", !token);
  }
  renderCart();
}
acts["sign-out"] = () => { lockOwner("Signed out."); };
window.addEventListener("hashchange", () => { route(); tick(); });

let busy = false;
async function tick() {
  if (busy) return;
  busy = true;
  try {
    if (!isOwnerView()) await loadShop();
    else if (token) await loadOwner();
  } catch (_) {
    setLive(false);
  } finally {
    busy = false;
  }
}

route();
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
